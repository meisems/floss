name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      # Includes the LiteSVM suite (real SPL Token / Token-2022 programs), which needs Linux.
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir dist
