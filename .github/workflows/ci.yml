name: ci

on:
  push:
  pull_request:

jobs:
  # Installs exactly like Cloudflare's build image (Node 22.16, npm 10.9.2, `npm install --progress=false`,
  # no lockfile), so a dependency change that would break the Cloudflare build fails here first.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - run: npm install -g npm@10.9.2
      - run: npm install --progress=false
      - if: failure()
        name: npm debug log
        run: grep -vE "^[0-9]+ (http|silly (fetch|packumentCache|tarball))" "$(ls -t ~/.npm/_logs/*-debug-0.log | head -n 1)" | tail -n 200
      - run: npm run build
      - run: npm run typecheck
      # Test-only: runs the real SPL Token / Token-2022 programs in-process. Kept out of
      # package.json so Cloudflare's install never sees its native binaries or peer ranges.
      - run: npm install --no-save litesvm@1.5.0
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir dist
